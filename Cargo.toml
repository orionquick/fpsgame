[workspace]
members = ["crates/city", "crates/render", "crates/editor", "crates/assets", "crates/app"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
