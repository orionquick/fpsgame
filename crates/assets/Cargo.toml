[package]
name = "assets"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
image = "0.25.10"
meshopt = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
