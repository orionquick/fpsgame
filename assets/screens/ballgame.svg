<?xml version="1.0" encoding="UTF-8"?>
<!--
  TV picture for the bar screens: a ball-game broadcast close-up (after the interior photo) - a player in a white
  jersey and brown cap against a soft-focus green stadium, a score panel at the right and a ticker along the
  bottom. Generic: no team marks or real names. Rendered by `fps svgtex` into an emissive screen texture.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a2a"/>
      <stop offset="0.45" stop-color="#4f6b3f"/>
      <stop offset="1" stop-color="#6f9a4c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#e9f2c9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e9f2c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jersey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d6cc"/>
      <stop offset="0.5" stop-color="#f6f4ee"/>
      <stop offset="1" stop-color="#cfcbbf"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9775a"/>
      <stop offset="0.55" stop-color="#d79a78"/>
      <stop offset="1" stop-color="#a86a4f"/>
    </linearGradient>
  </defs>
  <!-- soft-focus stadium: dark stands, a bright light bank, green field -->
  <rect width="1600" height="900" fill="url(#stand)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="#a9b98a" opacity="0.35">
    <circle cx="140" cy="210" r="34"/><circle cx="300" cy="160" r="26"/><circle cx="1220" cy="190" r="40"/>
    <circle cx="1380" cy="250" r="30"/><circle cx="980" cy="120" r="22"/><circle cx="520" cy="110" r="28"/>
  </g>
  <rect x="0" y="560" width="1600" height="340" fill="#78a650" opacity="0.6"/>
  <!-- the player: shoulders in a white pinstriped jersey, neck, face, brown cap with its brim -->
  <path d="M330,900 C350,700 470,610 640,585 L960,585 C1130,610 1250,700 1270,900 Z" fill="url(#jersey)"/>
  <g stroke="#b9b3a6" stroke-width="5" opacity="0.6">
    <line x1="520" y1="640" x2="470" y2="900"/><line x1="610" y1="600" x2="590" y2="900"/>
    <line x1="700" y1="590" x2="700" y2="900"/><line x1="900" y1="590" x2="900" y2="900"/>
    <line x1="990" y1="600" x2="1010" y2="900"/><line x1="1080" y1="640" x2="1130" y2="900"/>
  </g>
  <path d="M690,585 L800,700 L910,585 Z" fill="#5a3a26"/>
  <rect x="725" y="470" width="150" height="130" rx="40" fill="url(#skin)"/>
  <ellipse cx="800" cy="390" rx="130" ry="150" fill="url(#skin)"/>
  <path d="M690,430 C700,520 760,560 800,560 C840,560 900,520 910,430 C880,480 850,500 800,500 C750,500 720,480 690,430 Z" fill="#4a3426" opacity="0.85"/>
  <ellipse cx="755" cy="380" rx="16" ry="9" fill="#2a1d16"/><ellipse cx="845" cy="380" rx="16" ry="9" fill="#2a1d16"/>
  <path d="M665,330 C665,200 735,150 800,150 C865,150 935,200 935,330 Z" fill="#4b3020"/>
  <path d="M640,330 C700,300 900,300 960,330 C990,345 1000,360 980,368 C900,345 700,345 620,368 C600,360 610,345 640,330 Z" fill="#3c2618"/>
  <circle cx="800" cy="232" r="38" fill="#d9a83a"/>
  <!-- score panel, right -->
  <rect x="1300" y="60" width="250" height="300" rx="10" fill="#151a22" opacity="0.92"/>
  <rect x="1300" y="60" width="250" height="56" rx="10" fill="#c9a23a"/>
  <g fill="#f2f2ee">
    <rect x="1325" y="145" width="120" height="34"/><rect x="1475" y="140" width="50" height="44"/>
    <rect x="1325" y="215" width="120" height="34"/><rect x="1475" y="210" width="50" height="44"/>
    <rect x="1325" y="290" width="70" height="26"/><circle cx="1470" cy="303" r="12"/><circle cx="1505" cy="303" r="12" opacity="0.4"/>
  </g>
  <!-- ticker -->
  <rect x="0" y="815" width="1600" height="85" fill="#0f1420" opacity="0.95"/>
  <rect x="0" y="815" width="250" height="85" fill="#c9a23a"/>
  <g fill="#e6e6e2"><rect x="290" y="845" width="420" height="26"/><rect x="760" y="845" width="300" height="26"/><rect x="1110" y="845" width="380" height="26"/></g>
</svg>
