<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stencilled "rug" in the polished concrete under the bar lounge, drawn from the interior photos:
  - field: small seven-petal flowers (rounded paddle petals, thin at the hub) on a staggered grid
  - frame (from the field out): a thin rule, a gap, two thick rules, then a band of bold folk-art silhouettes
    (a bird with an upturned curling tail, alternating with a curling frond of rounded leaves), a thin outer rule
  Units are centimetres (720 x 540 cm). Rendered by `fps decal` into a cutout decal (colour + opacity); black = ink.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="540" viewBox="0 0 720 540">
  <defs>
    <!-- one petal: thin where it leaves the hub, swelling to a round tip (about 3.8 cm long) -->
    <path id="petal" d="M-0.22,-0.7 C-0.3,-1.5 -0.95,-2.1 -0.92,-2.85 A0.95,0.95 0 1 1 0.92,-2.85 C0.95,-2.1 0.3,-1.5 0.22,-0.7 Z"/>
    <g id="flower">
      <use xlink:href="#petal"/>
      <use xlink:href="#petal" transform="rotate(51.43)"/>
      <use xlink:href="#petal" transform="rotate(102.86)"/>
      <use xlink:href="#petal" transform="rotate(154.29)"/>
      <use xlink:href="#petal" transform="rotate(205.71)"/>
      <use xlink:href="#petal" transform="rotate(257.14)"/>
      <use xlink:href="#petal" transform="rotate(308.57)"/>
      <circle r="0.8"/>
    </g>
    <!-- staggered field: flowers on a 22 cm grid, every other row shifted half a cell, each turned a little -->
    <pattern id="field" patternUnits="userSpaceOnUse" width="22" height="22" x="11" y="11">
      <use xlink:href="#flower" transform="translate(0,0) rotate(8)"/>
      <use xlink:href="#flower" transform="translate(22,0) rotate(8)"/>
      <use xlink:href="#flower" transform="translate(0,22) rotate(8)"/>
      <use xlink:href="#flower" transform="translate(22,22) rotate(8)"/>
      <use xlink:href="#flower" transform="translate(11,11) rotate(-14)"/>
    </pattern>

    <!-- folk-art bird facing right, in a 30 x 24 box: round body, tail plume curling up over the back, small head -->
    <path id="bird" d="M23.5,18.6 C21.5,21.4 13.8,21.9 9.6,19.8 C6.9,18.4 5.6,16.6 5.9,14.6
      C3.6,12.9 2.4,10.1 3.2,7.4 C3.9,4.9 6.6,3.4 9.0,4.1 C10.9,4.7 11.6,6.6 10.6,7.9 C9.7,9.0 8.0,8.6 7.8,7.5
      C7.4,8.8 7.9,10.6 9.4,11.8 C11.4,11.0 14.6,11.4 17.4,12.0 C18.8,10.0 19.4,7.4 21.0,5.6
      C22.4,4.1 24.8,4.2 25.9,5.5 L29.6,6.4 L26.4,7.6 C26.0,9.4 24.6,10.8 23.8,12.6 C24.7,14.6 24.8,16.8 23.5,18.6 Z"/>
    <!-- curling frond: a stem rolling into a spiral, rounded leaves along it (in a 30 x 24 box) -->
    <g id="frond">
      <path d="M3,22 C5,15 9,10 15,8 C20,6.5 24,8 24.5,11.5 C25,14.5 21.8,15.6 20.4,13.6 C19.4,12.2 20.6,10.6 22,11.2"
            fill="none" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="6.4" cy="13.4" rx="3.3" ry="1.9" transform="rotate(-60 6.4 13.4)"/>
      <ellipse cx="11.6" cy="14.6" rx="3.1" ry="1.8" transform="rotate(20 11.6 14.6)"/>
      <ellipse cx="11.0" cy="5.6" rx="3.2" ry="1.9" transform="rotate(-25 11.0 5.6)"/>
      <ellipse cx="17.6" cy="3.6" rx="3.0" ry="1.8" transform="rotate(-5 17.6 3.6)"/>
      <ellipse cx="16.4" cy="13.4" rx="2.6" ry="1.6" transform="rotate(40 16.4 13.4)"/>
      <ellipse cx="26.8" cy="17.0" rx="2.8" ry="1.7" transform="rotate(55 26.8 17.0)"/>
      <circle cx="2.6" cy="9.0" r="1.2"/>
      <circle cx="27.6" cy="6.4" r="1.1"/>
    </g>
    <!-- band repeat (64 cm along, 28 cm across): bird, frond, mirrored bird, mirrored frond -->
    <pattern id="band" patternUnits="userSpaceOnUse" width="128" height="28">
      <g fill="#000" stroke="#000">
        <use xlink:href="#bird" transform="translate(1,2)" stroke="none"/>
        <use xlink:href="#frond" transform="translate(33,2)"/>
        <use xlink:href="#bird" transform="translate(95,2) scale(-1,1)" stroke="none"/>
        <use xlink:href="#frond" transform="translate(127,2) scale(-1,1)"/>
      </g>
    </pattern>

    <!-- corner square: a large seven-petal flower in a ring -->
    <g id="corner">
      <circle cx="17" cy="17" r="12" fill="none" stroke-width="1.4"/>
      <use xlink:href="#flower" transform="translate(17,17) scale(2.6)"/>
    </g>
  </defs>

  <g fill="#000" stroke="#000">
    <!-- outer thin rule, band, two thick rules, gap, inner thin rule -->
    <rect x="2" y="2" width="716" height="536" fill="none" stroke-width="0.9"/>
    <rect x="36.5" y="36.5" width="647" height="467" fill="none" stroke-width="2.2"/>
    <rect x="41.5" y="41.5" width="637" height="457" fill="none" stroke-width="2.2"/>
    <rect x="53" y="53" width="614" height="434" fill="none" stroke-width="0.9"/>

    <!-- silhouette bands: top and bottom run along x, the sides are the same band turned -->
    <rect x="36" y="5" width="648" height="28" fill="url(#band)" stroke="none"/>
    <rect x="36" y="507" width="648" height="28" fill="url(#band)" stroke="none" transform="rotate(180 360 521)"/>
    <g transform="translate(33,36) rotate(90)">
      <rect x="0" y="0" width="468" height="28" fill="url(#band)" stroke="none"/>
    </g>
    <g transform="translate(687,504) rotate(-90)">
      <rect x="0" y="0" width="468" height="28" fill="url(#band)" stroke="none"/>
    </g>

    <!-- corner squares -->
    <use xlink:href="#corner" transform="translate(2,2)"/>
    <use xlink:href="#corner" transform="translate(684,2)"/>
    <use xlink:href="#corner" transform="translate(2,504)"/>
    <use xlink:href="#corner" transform="translate(684,504)"/>

    <!-- the flower field inside the inner rule -->
    <rect x="58" y="58" width="604" height="424" fill="url(#field)" stroke="none"/>
  </g>
</svg>
